name: cosmosdb-relational-migration-guidance
description: Phase decisions and workflow boundaries, without running a migration.
type: capability

agent_environment:
  skills:
    - ../../skills/cosmosdb-migration
    - ../../skills/cosmosdb-best-practices

defaults:
  executor: copilot-sdk
  model: gpt-6.1-terra
  reasoning_effort: high
  judge_model: gpt-6.1-sol
  judge_reasoning_effort: high
  runs: 1
  timeout: 5m

scoring:
  threshold: 1

stimuli:
  - name: preflight-authoritative-ddl
    tags: { category: guidance, phase: preflight, contract: supplied-ddl }
    prompt: |
      For a relational-to-Cosmos DB migration, my supplied SQL DDL has Orders(Id, Total),
      but the ORM also has Discount. In autonomous preflight, should you add Discount
      to the DDL? Explain the next steps only; do not run a phase or write files.
    rubric:
      - Preserve the supplied DDL unchanged, record the discrepancy with the ORM, and use the DDL as authoritative rather than silently inferring or adding Discount.
    graders: &guidance
      - type: completed
      - type: skill-invocation
        config: { required: [cosmosdb-migration] }
      - type: prompt
        config: &judge
          scoring: binary
          threshold: 1
          prompt: >-
            Evaluate every rubric criterion. Accept semantically equivalent explanations
            without requiring exact phrases. Reject substantive omissions, contradictions,
            and incorrect advice. Keyword mentions alone do not satisfy a criterion.
      - type: output-matches
        config: { pattern: '\S' }
      - type: diff-empty

  - name: preflight-inferred-schema
    tags: { category: guidance, phase: preflight, contract: inferred-ddl }
    prompt: |
      I want to migrate a relational app to Cosmos DB but have no DDL, only ORM models,
      migrations and queries. I forbid external parser dependencies. Explain schema
      acquisition and its limits; do not run a phase or write files.
    rubric:
      - Infer a typed source inventory directly from project evidence without requiring synthesized DDL, recording provenance, conflicts and uncertainty rather than inventing missing constraints.
      - Use model-only interpretation without Python, SQLGlot, or a custom parser script, and do not claim structural validation proves source-engine fidelity.
    graders: *guidance

  - name: preflight-workload-contradiction
    tags: { category: guidance, phase: preflight, contract: workload-contradiction }
    prompt: |
      In a relational-to-Cosmos migration, an engineer supplied an estimate of 1,000
      rows for dbo.BuildVersion, whose authoritative DDL has a unique TINYINT primary key.
      How should preflight handle this mismatch? Explain only; do not write files,
      run a phase, or silently change the supplied estimate.
    rubric:
      - Identify that a SQL Server TINYINT key has at most 256 distinct values and cannot uniquely identify 1,000 simultaneous rows.
      - Preserve the supplied evidence, flag the inconsistency, and request a corrected or verified count or record the feasible count as unknown; do not invent a replacement count, change the DDL, or present the estimate as observed or feasible.
    graders: *guidance

  - name: parser-choice-and-failure
    tags: { category: guidance, phase: preflight, contract: parser-consent }
    prompt: |
      Explain parser selection for the relational-to-Cosmos migration skill in three cases:
      an interactive first run, an unattended default when SQLGlot cannot be installed,
      and an explicit SQLGlot request when installation fails. Do not execute anything
      or write files.
    rubric:
      - Interactive first use requires permission, disclosure of SQLGlot as an external MIT-licensed Python dependency with its upstream link, and a model-only alternative.
      - An unattended-default installation failure warns and falls back to model-only with persisted fallback metadata; an explicit SQLGlot choice fails rather than silently downgrading.
    graders: *guidance

  - name: parser-first-use-consent
    tags: { category: guidance, phase: preflight, contract: parser-consent, regression: parser-first-use }
    prompt: |
      I have selected authoritative SQL Server DDL for my relational-to-Cosmos DB
      migration, but have not chosen a parser and have no saved parser decision.
      Present the initial parser choice to me now, then end this turn so I can answer.
      Do not merely describe what you would ask. You may read installed skill guidance,
      but do not inspect or interpret source files, initialize a project, record a choice,
      install anything, run a phase, or make external-service calls.
    rubric:
      - Present an actual choice to the user between SQLGlot, model-only interpretation and stopping; do not merely narrate a future permission request.
      - Identify SQLGlot as an external MIT-licensed Python dependency, link to https://github.com/tobymao/sqlglot, mention possible local installation, and explain that model-only interpretation avoids installing or invoking an external parser.
      - Stop for the user's answer without choosing or claiming approval, recording a parser decision, interpreting DDL, initializing migration state, installing dependencies or invoking a parser. A noninteractive host does not override this explicit stop request.
    graders: *guidance

  - name: assessment-domain-ownership
    tags: { category: guidance, phase: assessment, contract: domain-ownership }
    prompt: |
      In my relational-to-Cosmos migration, Billing and Catalog share reporting joins
      but have different owners and lifecycles. A legacy table owned by Billing has no
      observed application access. Explain assessment boundaries and table ownership; do not run the phase
      or write files.
    rubric:
      - Prioritize business ownership, lifecycle and consistency invariants over reporting joins; a domain is not a logical partition or final container design.
      - Assign each non-excluded table to exactly one domain, retaining the legacy table with explicit mapping uncertainty rather than silently excluding it.
      - Record cross-domain dependencies and defer final container and partition-key decisions beyond assessment. Accept equivalent wording without requiring the later phase's name; reject choosing a final container layout or partition key during assessment.
    graders: *guidance

  - name: planning-unselected-mechanism
    tags: { category: guidance, phase: code-migration, contract: planning-mechanism, regression: planning-quality }
    prompt: |
      An accepted relational-to-Cosmos conversion says a future integrity service will
      provide source-wide uniqueness with exact SQL collation and fenced publication.
      No comparison implementation or weight-data supplier, backing store or atomic
      fencing primitive has been selected. The code plan marks this design blocker
      resolved: "implement the service; prove parity and failover later."
      It also selects a supported framework upgrade with a known package/API path,
      whose build has not yet run. Explain the correct dispositions and next steps.
      Outline concrete alternatives for each open decision: how to implement exact
      comparison and obtain compatible weight data, and how to store state and fence
      publication atomically. Explain what evidence or approval would let the team
      choose between the options. Do not choose an architecture or change the accepted
      model. Do not write files, execute checks, or treat conversion completion as proof of feasibility.
    rubric:
      - Keep the unspecified comparator and fencing/store mechanisms as unresolved design choices with concrete alternatives, required approval or evidence and affected-task clearance; naming a service plus future tests does not resolve them.
      - Distinguish the known framework upgrade and other specified implementation work from an unselected mechanism; a missing build or runtime proof alone does not make an otherwise specified implementation choice unresolved, but the checks remain required.
      - Preserve the accepted conditional model and its obligations; do not silently introduce an unapproved service, weaken source semantics, or claim implementation or verification occurred.
    graders: *guidance

  - name: unrelated-postgresql
    tags: { category: activation, contract: non-activation }
    prompt: Explain briefly how to create a PostgreSQL index on users(email). Do not write files.
    rubric:
      - Give valid PostgreSQL CREATE INDEX guidance without initiating a Cosmos DB migration or substituting Cosmos DB indexing policy.
    graders:
      - type: completed
      - type: skill-invocation
        config: { disallowed: [cosmosdb-migration, cosmosdb-best-practices] }
      - type: prompt
        config: *judge
      - type: output-matches
        config: { pattern: '\S' }
      - type: diff-empty
