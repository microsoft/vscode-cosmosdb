# =============================================================================
# Packages build pipeline for the publishable npm workspace packages.
#
# Produces one pipeline artifact per package named `Build <tgz-prefix>`, each
# containing that package's `.tgz`. Consumed by `release-npm.yml`, whose
# `resources.pipelines.build.source` must point at THIS pipeline (registered
# in ADO as \VSCode Extensions\vscode-cosmosdb Build NPM).
#
# NOTE (why this is NOT the shared azExtTemplates 1esstages.yml): that template
# runs `npm ci` in each package's working_directory, which only works for
# standalone npm projects. This repo is an npm *workspaces* monorepo (single root
# lockfile), so we `npm ci` at the ROOT and build/pack individual workspaces.
#
# npm packages are source-only and are NOT code-signed (VSIX-only), so there is
# no MicroBuild signing step here — this extends the OneBranch GovernedTemplates
# (same template family as build.yml / release-extension.yml in this repo, and
# the same one used by vscode-documentdb's working npm build pipeline), NOT the
# 1ESPipelineTemplates/MicroBuildTemplate repo (that one lives outside msdata
# and is only needed for VSIX/MicroBuild signing scenarios).
# =============================================================================

name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none # TODO: switch to [main, rel/*] once validated in ADO
pr: none

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

variables:
  CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)] # needed for onebranch.pipeline.version task https://aka.ms/obpipelines/versioning
  WindowsContainerImage: "onebranch.azurecr.io/windows/ltsc2022/vse2022:latest"
  TeamName: "Azure Cosmos DB - Desktop Tools"

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      asyncSdl:
        enabled: false
      tsa:
        enabled: false
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)/.azure-pipelines/compliance/CredScanSuppressions.json
      policheck:
        break: true
      suppression:
        suppressionFile: $(Build.SourcesDirectory)/.config/guardian/.gdnsuppress
      codeql:
        compiled:
          enabled: false
        tsaEnabled: false
      componentgovernance:
        ignoreDirectories: $(Build.SourcesDirectory)/.vscode-test
    featureFlags:
      linuxEsrpSigning: true
      WindowsHostVersion:
        Version: 2022

    stages:
      - stage: BuildPackages
        displayName: Build & pack npm packages
        jobs:
          - job: azure_cosmosdb_schema_analyzer
            displayName: Pack azure-cosmosdb-schema-analyzer
            pool:
              type: windows
            variables:
              ob_outputDirectory: "$(Build.ArtifactStagingDirectory)/build/azure-cosmosdb-schema-analyzer"
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: "Publish Build azure-cosmosdb-schema-analyzer"
                  targetPath: $(Build.ArtifactStagingDirectory)/build/azure-cosmosdb-schema-analyzer
                  artifactName: Build azure-cosmosdb-schema-analyzer
            steps:
              - task: NodeTool@0
                displayName: "Use Node.js (.nvmrc)"
                inputs:
                  versionSource: fromFile
                  versionFilePath: .nvmrc

              # Workspaces monorepo: install once at the repo root, exactly like
              # build.yml's '⬇️ Install Dependencies' step — authenticate to and
              # install from the internal ADO npm feed (.azure-pipelines/.npmrc),
              # not directly against registry.npmjs.org. A plain `npm ci` resolving
              # straight to npmjs.org was hitting persistent EACCES failures on
              # this Windows pool; going through the same internal feed as the
              # proven build.yml pipeline avoids that path entirely.
              - task: npmAuthenticate@0
                displayName: "Authenticate to npm registry"
                inputs:
                  workingFile: "$(Build.SourcesDirectory)/.azure-pipelines/.npmrc"

              - task: Npm@1
                displayName: "Install dependencies (root)"
                inputs:
                  command: custom
                  customCommand: ci --userconfig $(Build.SourcesDirectory)/.azure-pipelines/.npmrc
                  workingDir: $(Build.SourcesDirectory)

              # Build both publishable workspaces (schema-analyzer first: nosql depends on it).
              - task: Npm@1
                displayName: "Build packages"
                inputs:
                  command: custom
                  customCommand: run build --workspace packages/schema-analyzer --workspace packages/nosql-language-service
                  workingDir: $(Build.SourcesDirectory)

              # npm pack does not create --pack-destination itself; ensure it exists first.
              - task: PowerShell@2
                displayName: "Create artifact staging directory"
                inputs:
                  targetType: "inline"
                  script: |
                    New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/build/azure-cosmosdb-schema-analyzer" | Out-Null

              # Pack just this package's workspace straight into its artifact folder.
              - task: Npm@1
                displayName: "npm pack azure-cosmosdb-schema-analyzer"
                inputs:
                  command: custom
                  customCommand: pack --workspace packages/schema-analyzer --pack-destination "$(Build.ArtifactStagingDirectory)/build/azure-cosmosdb-schema-analyzer"
                  workingDir: $(Build.SourcesDirectory)

              # Also drop the resolved package.json next to the tgz so the release
              # pipeline can read/verify the version without cloning the source.
              # Windows pool (OneBranch build stage) — use PowerShell, not `cp`.
              - task: PowerShell@2
                displayName: "Stage package.json"
                inputs:
                  targetType: "inline"
                  workingDirectory: $(Build.SourcesDirectory)
                  script: |
                    Copy-Item `
                      "packages/schema-analyzer/package.json" `
                      "$(Build.ArtifactStagingDirectory)/build/azure-cosmosdb-schema-analyzer/package.json"

          - job: azure_cosmosdb_nosql_language_service
            displayName: Pack azure-cosmosdb-nosql-language-service
            pool:
              type: windows
            variables:
              ob_outputDirectory: "$(Build.ArtifactStagingDirectory)/build/azure-cosmosdb-nosql-language-service"
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: "Publish Build azure-cosmosdb-nosql-language-service"
                  targetPath: $(Build.ArtifactStagingDirectory)/build/azure-cosmosdb-nosql-language-service
                  artifactName: Build azure-cosmosdb-nosql-language-service
            steps:
              - task: NodeTool@0
                displayName: "Use Node.js (.nvmrc)"
                inputs:
                  versionSource: fromFile
                  versionFilePath: .nvmrc

              # Workspaces monorepo: install once at the repo root, exactly like
              # build.yml's '⬇️ Install Dependencies' step — authenticate to and
              # install from the internal ADO npm feed (.azure-pipelines/.npmrc),
              # not directly against registry.npmjs.org. A plain `npm ci` resolving
              # straight to npmjs.org was hitting persistent EACCES failures on
              # this Windows pool; going through the same internal feed as the
              # proven build.yml pipeline avoids that path entirely.
              - task: npmAuthenticate@0
                displayName: "Authenticate to npm registry"
                inputs:
                  workingFile: "$(Build.SourcesDirectory)/.azure-pipelines/.npmrc"

              - task: Npm@1
                displayName: "Install dependencies (root)"
                inputs:
                  command: custom
                  customCommand: ci --userconfig $(Build.SourcesDirectory)/.azure-pipelines/.npmrc
                  workingDir: $(Build.SourcesDirectory)

              # Build both publishable workspaces (schema-analyzer first: nosql depends on it).
              - task: Npm@1
                displayName: "Build packages"
                inputs:
                  command: custom
                  customCommand: run build --workspace packages/schema-analyzer --workspace packages/nosql-language-service
                  workingDir: $(Build.SourcesDirectory)

              # npm pack does not create --pack-destination itself; ensure it exists first.
              - task: PowerShell@2
                displayName: "Create artifact staging directory"
                inputs:
                  targetType: "inline"
                  script: |
                    New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/build/azure-cosmosdb-nosql-language-service" | Out-Null

              # Pack just this package's workspace straight into its artifact folder.
              - task: Npm@1
                displayName: "npm pack azure-cosmosdb-nosql-language-service"
                inputs:
                  command: custom
                  customCommand: pack --workspace packages/nosql-language-service --pack-destination "$(Build.ArtifactStagingDirectory)/build/azure-cosmosdb-nosql-language-service"
                  workingDir: $(Build.SourcesDirectory)

              # Also drop the resolved package.json next to the tgz so the release
              # pipeline can read/verify the version without cloning the source.
              # Windows pool (OneBranch build stage) — use PowerShell, not `cp`.
              - task: PowerShell@2
                displayName: "Stage package.json"
                inputs:
                  targetType: "inline"
                  workingDirectory: $(Build.SourcesDirectory)
                  script: |
                    Copy-Item `
                      "packages/nosql-language-service/package.json" `
                      "$(Build.ArtifactStagingDirectory)/build/azure-cosmosdb-nosql-language-service/package.json"
