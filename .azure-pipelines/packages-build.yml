# =============================================================================
# DRAFT — packages build pipeline for the publishable npm workspace packages.
#
# Produces one pipeline artifact per package named `Build <tgz-prefix>`, each
# containing that package's `.tgz`. Consumed by `release-npm.yml`, whose
# `resources.pipelines.build.source` must point at THIS pipeline once it is
# registered in ADO (suggested name: \Azure Tools\VSCode\Packages\vscode-cosmosdb).
#
# NOTE (why this is NOT the shared azExtTemplates 1esstages.yml): that template
# runs `npm ci` in each package's working_directory, which only works for
# standalone npm projects. This repo is an npm *workspaces* monorepo (single root
# lockfile), so we `npm ci` at the ROOT and build/pack individual workspaces.
#
# npm packages are source-only and are NOT code-signed (VSIX-only), so there is
# no MicroBuild signing step here.
#
# ⚠️ DRAFT: validate in ADO before relying on it. Trigger is disabled until then.
# =============================================================================

name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none # TODO: switch to [main, rel/*] once validated in ADO
pr: none

parameters:
  - name: isOfficialBuild
    displayName: Official Build
    type: boolean
    default: true
  # The workspace packages to build + pack. `name` is the .tgz filename prefix
  # (scope '@azure/' -> 'azure-'); `dir` is the folder under packages/.
  - name: packages
    type: object
    default:
      - name: azure-cosmosdb-schema-analyzer
        dir: schema-analyzer
      - name: azure-cosmosdb-nosql-language-service
        dir: nosql-language-service

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/tags/release

variables:
  # Required by MicroBuild template
  - name: TeamName
    value: "Azure Tools for VS Code"

extends:
  ${{ if eq(parameters.isOfficialBuild, true) }}:
    template: azure-pipelines/MicroBuild.1ES.Official.yml@1esPipelines
  ${{ else }}:
    template: azure-pipelines/MicroBuild.1ES.Unofficial.yml@1esPipelines
  parameters:
    sdl:
      sourceAnalysisPool:
        name: VSEngSS-MicroBuild2022-1ES
        image: server2022-microbuildVS2022-1es
        os: windows
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)/.azure-pipelines/compliance/CredScanSuppressions.json
      componentgovernance:
        ignoreDirectories: $(Build.SourcesDirectory)/.vscode-test
      codeql:
        excludePathPatterns: "**/.vscode-test, dist"

    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Ubuntu22.04
      os: linux

    stages:
      - stage: BuildPackages
        displayName: Build & pack npm packages
        jobs:
          - ${{ each pkg in parameters.packages }}:
              # ADO job names allow alphanumerics + underscores only, so hyphens -> underscores.
              - job: ${{ replace(pkg.name, '-', '_') }}
                displayName: Pack ${{ pkg.name }}
                templateContext:
                  outputs:
                    - output: pipelineArtifact
                      displayName: "Publish Build ${{ pkg.name }}"
                      targetPath: $(Build.ArtifactStagingDirectory)/build/${{ pkg.name }}
                      artifactName: Build ${{ pkg.name }}
                steps:
                  - task: NodeTool@0
                    displayName: "Use Node.js (.nvmrc)"
                    inputs:
                      versionSource: fromFile
                      versionFilePath: .nvmrc

                  # Workspaces monorepo: install once at the repo root.
                  - script: npm ci
                    displayName: "Install dependencies (root)"
                    workingDirectory: $(Build.SourcesDirectory)

                  # Build both publishable workspaces (schema-analyzer first: nosql depends on it).
                  - script: >-
                      npm run build
                      --workspace packages/schema-analyzer
                      --workspace packages/nosql-language-service
                    displayName: "Build packages"
                    workingDirectory: $(Build.SourcesDirectory)

                  # Pack just this package's workspace straight into its artifact folder.
                  - script: >-
                      npm pack
                      --workspace packages/${{ pkg.dir }}
                      --pack-destination "$(Build.ArtifactStagingDirectory)/build/${{ pkg.name }}"
                    displayName: "npm pack ${{ pkg.name }}"
                    workingDirectory: $(Build.SourcesDirectory)

                  # Also drop the resolved package.json next to the tgz so the release
                  # pipeline can read/verify the version without cloning the source.
                  - script: >-
                      cp packages/${{ pkg.dir }}/package.json
                      "$(Build.ArtifactStagingDirectory)/build/${{ pkg.name }}/package.json"
                    displayName: "Stage package.json"
                    workingDirectory: $(Build.SourcesDirectory)
