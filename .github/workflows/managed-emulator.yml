name: Managed Cosmos DB Emulator

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/managed-emulator.yml'
      - 'src/services/managedEmulator/**'
      - 'src/webviews/cosmosdb/EmulatorSetup/**'
      - 'src/tree/workspace-view/cosmosdb/LocalEmulators/**'
      - 'src/panels/EmulatorSetupTab.ts'
      - 'src/cosmosdb/getCosmosClient.ts'
      - 'test/e2e/specs/managed-emulator.spec.ts'
      - 'package*.json'
      - 'vitest*.ts'

jobs:
  lifecycle:
    name: Managed lifecycle (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare rootless Podman
        if: matrix.engine == 'podman'
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman info --format '{{.Host.Security.Rootless}}' | grep -Fx true
      - name: Check persistence and loopback bindings
        env:
          COSMOSDB_MANAGED_TEST_ENGINE: ${{ matrix.engine }}
        run: npm exec -- vitest run src/services/managedEmulator/managedEmulator.integration.test.ts
      - name: Install VS Code system dependencies
        run: npm exec -- playwright install-deps chromium
      - name: Build production extension
        run: npm run vite-prod
      - name: Trace Podman failures from the VS Code extension host
        if: matrix.engine == 'podman'
        run: |
          export PODMAN_REAL="$(command -v podman)"
          export PODMAN_TRACE="$RUNNER_TEMP/podman-e2e.log"
          printf 'PODMAN_REAL=%s\nPODMAN_TRACE=%s\n' "$PODMAN_REAL" "$PODMAN_TRACE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/podman-e2e"
          cat > "$RUNNER_TEMP/podman-e2e/podman" <<'BASH'
          #!/usr/bin/env bash
          stderr=$(mktemp)
          trap 'rm -f "$stderr"' EXIT
          "$PODMAN_REAL" "$@" 2>"$stderr"
          rc=$?
          cat "$stderr" >&2
          if [[ $rc != 0 ]]; then
            args=("$@")
            [[ ${args[0]} == --remote=false ]] && args=("${args[@]:1}")
            command=${args[0]}
            case "$command" in
              container|volume) command="$command ${args[1]}" ;;
              info|pull|--version) ;;
              *) command=other ;;
            esac
            reason=$(grep -Eoi 'permission denied|operation not permitted|newuidmap|newgidmap|crun|conmon|apparmor|user namespace|cgroup|XDG_RUNTIME_DIR|mount|storage|lock|socket|re-exec|setresuid|lstat|chown|overlay|proc/self|pause process|runroot|graphroot|readlink|/ns/user' "$stderr" | sort -fu | paste -sd ' ' -)
            printf '%s: exit %d (%s)\n' "$command" "$rc" "$reason" >> "$PODMAN_TRACE"
          fi
          exit "$rc"
          BASH
          chmod +x "$RUNNER_TEMP/podman-e2e/podman"
          echo "$RUNNER_TEMP/podman-e2e" >> "$GITHUB_PATH"
      - name: Create and browse a managed emulator in VS Code
        env:
          COSMOSDB_MANAGED_TEST_ENGINE: ${{ matrix.engine }}
          COSMOSDB_E2E_SKIP_EMULATOR: '1'
          COSMOSDB_E2E_SKIP_BUILD: '1'
        run: xvfb-run -a npm run e2e -- managed-emulator.spec.ts --workers=1
      - name: Show Podman failure categories
        if: failure() && matrix.engine == 'podman'
        run: |
          if [[ -f "$PODMAN_TRACE" ]]; then cat "$PODMAN_TRACE"; fi
