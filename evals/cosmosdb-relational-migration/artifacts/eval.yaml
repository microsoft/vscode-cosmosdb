name: cosmosdb-relational-migration-artifacts
description: Execute bounded phases in synthetic workspaces and independently validate the resulting artifacts.
type: capability

agent_environment:
  skills:
    - ../../../skills/cosmosdb-migration
    - ../../../skills/cosmosdb-best-practices
  files:
    - { src: ../setup.mjs, dest: setup.mjs }
    - { src: ../fixtures.mjs, dest: fixtures.mjs }

defaults:
  executor: copilot-sdk
  model: gpt-6.1-terra
  reasoning_effort: high
  judge_model: gpt-6.1-sol
  judge_reasoning_effort: high
  runs: 1
  timeout: 15m

scoring:
  threshold: 1

stimuli:
  - name: preflight-artifacts
    tags: { category: artifacts, phase: preflight }
    agent_environment:
      commands: [node setup.mjs preflight]
    prompt: |
      Run only preflight for the relational-to-Cosmos DB migration in ./app, autonomously.
      Use model-only DDL interpretation; no Python, SQLGlot, custom DDL parser, installs,
      source database access, or cloud calls. The existing DDL and application details
      are authoritative. The supplied volumetrics and access-pattern tables are synthetic
      evaluation inputs; preserve their values and disclose that they are not production
      measurements. Complete and validate the phase artifacts. Do not execute discovery,
      assessment, conversion, provisioning or code migration. Keep application files and
      unknown project properties unchanged. Do not analyze projects outside ./app.
    rubric:
      - Produce a faithful source inventory for dbo.Orders with Id as primary key and all three supplied columns, without modifying DDL or application files.
      - Report preflight completion only after validating required artifacts and freshness; do not evaluate SDK compatibility or advance discovery.
      - Explicitly distinguish the synthetic workload values from production observations.
    graders:
      - type: completed
      - type: skill-invocation
        config: { required: [cosmosdb-migration] }
      - type: migration-artifacts
        config: { phase: preflight }
      - type: prompt
        config: &artifact-judge
          scoring: binary
          threshold: 1
          evidence: [trajectory, diff, repo]
          prompt: >-
            Evaluate every rubric criterion against the generated files and trajectory,
            not just the final claims. Accept semantically equivalent explanations.
            Reject substantive omissions, contradictions, fabricated evidence, and
            incorrect advice. Do not demand exact prose or a particular tool sequence.
      - type: output-matches
        config: { pattern: '\S' }
    artifacts:
      include: [app/.cosmosdb-migration/**]

  - name: preflight-to-discovery-instruction-routing
    tags: { category: artifacts, phase: discovery, contract: instruction-routing }
    agent_environment:
      commands: [node setup.mjs discovery]
    turns:
      - |
        Run only the schema-acquisition preflight step for the migration in ./app,
        autonomously, using the supplied authoritative DDL and model-only interpretation.
        Run ID: routing-schema.
        For this entire conversation, preserve application files, supplied DDL,
        existing synthetic workload estimates, and unknown project properties.
        Do not install dependencies, execute application code, use a custom DDL parser,
        access databases or cloud services, or analyze projects outside ./app.
        Stop after the requested step and report the remaining readiness gates.
      - |
        Run only the volumetrics preflight step. For this synthetic planning scenario,
        retention is 30 days and peak traffic is 100 read requests per second.
        These are additional planning requirements, not production measurements or
        replacements for the existing per-table estimates. Use the access patterns
        already available and keep their artifact unchanged.
        Run ID: routing-volumetrics.
      - |
        Now run discovery only, using the prepared inputs and the discovery focus I
        previously saved in the project. Work autonomously, validate the discovery
        checkpoint, and stop before assessment. Keep the earlier safety restrictions.
        Run ID: routing-discovery.
    rubric:
      - Execute schema acquisition, then volumetrics, then discovery in the requested turns. The earlier focused-step commands must not prevent the final discovery run or cause it to stop at preflight.
      - Preserve the saved discoveryInstructions exactly throughout all turns. Do not append launch commands, run IDs, execution mode, or the supplied workload requirements to any phase instruction field.
      - Record the 30-day retention and 100 peak read requests per second in volumetrics evidence with synthetic planning provenance and clear units, without replacing supplied per-table estimates or modifying the access-pattern artifact.
      - Apply the saved tenant-isolation focus to the discovery report, tracing the actual query evidence rather than claiming that a TenantId column alone proves tenant isolation.
      - Complete and validate discovery without advancing assessment, changing application files, or treating synthetic workload inputs as observed production data.
    graders:
      - type: completed
      - type: skill-invocation
        config: { required: [cosmosdb-migration] }
      - type: migration-artifacts
        config: { phase: discovery }
      - type: prompt
        config: *artifact-judge
      - type: output-matches
        config: { pattern: '\S' }
    artifacts:
      include: [app/.cosmosdb-migration/**]

  - name: provisioning-target-switch
    tags: { category: artifacts, phase: provisioning, contract: target-switch }
    agent_environment:
      commands: [node setup.mjs provisioning]
    prompt: |
      Continue the relational-to-Cosmos DB migration in ./app. I approve changing only
      the saved target database from orders-previous-target to orders-next-target on
      the same saved account. Persist this selection and regenerate the existing
      target-dependent provisioning artifacts using the accepted model and sample data.
      Keep the migration's identity, accepted upstream artifacts and freshness, saved
      account coordinates, application files and user metadata unchanged. Do not
      redesign the model or rerun upstream phases.

      This is artifact-only work: allow-provisioning is false. Do not contact Azure or
      any database, install dependencies, deploy, execute seed scripts or change data.
      The previous completed checkpoint and readback are synthetic fixture history,
      not evidence for the replacement target. Leave provisioning in progress and the
      new target unverified. In the provisioning summary, record the approved switch,
      preservation of the old database and unrelated data, and the verification still
      required before any future completion claim. Work only inside ./app.
    rubric:
      - Record the approved database switch and distinguish regenerated local artifacts from deployment or verification; require fresh target, resource and sample checks before completion.
      - Preserve the previous database and unrelated data; the target-name approval does not authorize deployment, seeding or other resource or data mutations.
      - Do not contact external resources or execute deployment or seed commands; historical synthetic readback is not new observed evidence.
    graders:
      - type: completed
      - type: skill-invocation
        config: { required: [cosmosdb-migration] }
      - type: migration-artifacts
        config: { phase: provisioning }
      - type: prompt
        config: *artifact-judge
      - type: output-matches
        config: { pattern: '\S' }
    artifacts:
      include: [app/.cosmosdb-migration/**]

  - name: ttl-readiness-review
    tags: { category: artifacts, phase: schema-conversion, contract: ttl-readiness }
    agent_environment:
      commands: [node setup.mjs ttl-readiness]
    prompt: |
      Review the migration in ./app. The project records conversion as complete. Can we
      accept the retention design and use the staged provisioning samples as supplied?
      Independently run the local read-only conversion-evidence and sample-data checks,
      inspect the underlying artifacts, and report the readiness decision and necessary
      corrections. Do not repair files, advance phases, deploy, seed, or contact services.
    rubric:
      - Use both local validation results and artifact evidence. Distinguish the valid 30-second backfill/update evidence for Orders/Order from the missing expiration evidence for OrdersByTenant/OrderMembership. A matching container default is not proof that the projection preserves retention.
      - Identify the unmodeled root ttl of 60 on the Orders seed item. It is a valid duration but overrides the intended 30-second retention. Remove it to inherit the default rather than changing the model merely to pass validation.
      - Refuse conversion acceptance and provisioning readiness despite the saved completion status. Require same-item backfill/update evidence for the projection and revalidation of both corrected artifacts. Report only; do not change state or execute deployment or seed operations.
    graders:
      - type: completed
      - type: skill-invocation
        config: { required: [cosmosdb-migration] }
      - type: prompt
        config: *artifact-judge
      - type: output-matches
        config: { pattern: '\S' }
      - type: diff-empty

  - name: assessment-artifacts
    tags: { category: artifacts, phase: assessment }
    agent_environment:
      commands: [node setup.mjs assessment]
    prompt: |
      Run only assessment for the relational-to-Cosmos DB migration in ./app, autonomously.
      Preflight and discovery are already complete. Assign the authoritative dbo.Orders
      table to its business domain, retain its confirmed application mapping, produce
      the assessment summary and domain evidence, and validate completion. These inputs
      are synthetic; do not claim production measurements. Preserve existing source,
      preflight and discovery artifacts and unknown project properties. Do not choose
      final containers or partition keys, execute schema conversion, install dependencies,
      contact databases or Azure, or change application code. Analyze no other project.
    rubric:
      - Assign dbo.Orders exactly once to a coherent, mapped business domain with its read pattern and evidence-backed rationale.
      - Produce the root and domain assessment summaries and manifests and validate the assessment checkpoint, including freshness.
      - Preserve accepted source and predecessor artifacts and stop before final Cosmos DB model design or any resource mutation.
    graders:
      - type: completed
      - type: skill-invocation
        config: { required: [cosmosdb-migration] }
      - type: migration-artifacts
        config: { phase: assessment }
      - type: prompt
        config: *artifact-judge
      - type: output-matches
        config: { pattern: '\S' }
    artifacts:
      include: [app/.cosmosdb-migration/**]
